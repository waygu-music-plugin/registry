name: Publish catalog

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: Optional version tag for a catalog snapshot
        required: false

permissions:
  contents: write

concurrency: official-catalog

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify signed plugin releases
        run: python3 update_catalog.py
      - name: Publish catalog
        run: |
          if [[ -n "$SNAPSHOT_TAG" ]]; then
            [[ $SNAPSHOT_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh the official plugin catalog"
            git push origin HEAD:main
          fi
          if [[ -n "$SNAPSHOT_TAG" ]] && ! gh release view "$SNAPSHOT_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$SNAPSHOT_TAG" -R "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
              --title "$SNAPSHOT_TAG" --notes '包含各插件最新正式版的官方目录快照。' catalog.json
          fi
